<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Write a tonto ontology and see its OntoUML diagram, in the browser. Nothing is sent anywhere.">
    <title>tonto playground</title>
    <!-- From tonto-brand: the 16-px drawing for tabs, the PNG where SVG icons are not read. -->
    <link rel="icon" type="image/svg+xml" href="/brand/tonto-icon-16.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/tonto-icon-32.png">
    <link rel="apple-touch-icon" href="/brand/tonto-icon-256.png">
    <meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
</head>
<body>
    <header id="bar">
        <a class="brand" href="https://github.com/nemo-ufes/tonto" target="_blank" rel="noopener" title="tonto, a textual ontology modeling language">
            <img class="brand-logo for-light" src="/brand/tonto-horizontal-light.svg" alt="tonto" width="110" height="36">
            <img class="brand-logo for-dark" src="/brand/tonto-horizontal-dark.svg" alt="tonto" width="110" height="36">
            <span class="brand-light">playground</span>
        </a>
        <label class="examples">
            <span class="visually-hidden">Open an example</span>
            <select id="examples" title="Replace the text with an example model">
                <option value="">Examples…</option>
            </select>
        </label>
        <button id="open" type="button" title="Open a .tonto file from this computer">Open…</button>
        <input id="openFile" type="file" accept=".tonto,text/plain" hidden>
        <button id="download" type="button" title="Save the text as a .tonto file">Download</button>
        <button id="share" type="button" title="Copy a link that contains this model">Copy link</button>
        <span class="spacer"></span>
        <span id="problems" class="problems" role="status" aria-live="polite"></span>
        <span class="pane-switch" role="group" aria-label="Show">
            <button id="showText" type="button" aria-pressed="true">Text</button>
            <button id="showDiagram" type="button" aria-pressed="false">Diagram</button>
        </span>
        <button id="theme" type="button" title="Switch between light and dark">Dark</button>
        <a class="about" href="https://github.com/nemo-ufes/tonto" target="_blank" rel="noopener" title="The tonto language">About tonto</a>
    </header>
    <main id="split" data-show="text">
        <section id="editor" aria-label="tonto text"></section>
        <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the panes" tabindex="0"></div>
        <section id="diagram" aria-label="OntoUML diagram"></section>
    </main>
    <dialog id="exportDialog" aria-labelledby="exportTitle">
        <form method="dialog">
            <p id="exportTitle">Export the diagram as</p>
            <button value="svg" type="submit">SVG drawing</button>
            <button value="png" type="submit">PNG picture</button>
            <button value="tontoview" type="submit" title="The arrangement, for the tonto visualizer in VS Code">Arrangement (.tontoview)</button>
            <button value="" type="submit" class="cancel">Cancel</button>
        </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
